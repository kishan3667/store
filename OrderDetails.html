<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Order Details</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="theme-st.css">
<link rel="stylesheet" href="media-st.css">
<link rel="stylesheet" href="OrderDetails.css">
  <link rel="icon" href="1.jpg">

</head>

<body>

<div class="header">

    <div class="logo-title">
        🛒 Order Details
    </div>

    <div class="header-right">

        <div class="wallet-pill"
             onclick="location.href='wallet-topup.html'">

            💰
            <span id="walletBalance">
                Rs. 0.00
            </span>

        </div>

    </div>

</div>


<div class="order-container">

    <div class="order-card">

        <div class="product-image">

            <img
            id="productImage"
            src="1.jpg"
            alt="Product">

        </div>


        <h2 id="productName">

            Loading...

        </h2>

        <h3 id="productPrice">

            Rs.0.00

        </h3>


        <div class="input-group">

            <label>

                🎮 Game UID

            </label>

            <input
            type="text"
            id="uid"
            placeholder="Enter your Game UID">

        </div>


        <div class="wallet-box">

            <span>

                Wallet Balance

            </span>

            <strong id="walletBalanceCard">

                Rs.0.00

            </strong>

        </div>


        <button
        id="submitBtn">

            🚀 Submit Top Up

        </button>


        <p
        id="msg">

        </p>

    </div>

</div>


<div class="bottom-nav">

<a href="home.html" class="nav-item">
<i class="fas fa-home"></i>
<span>Home</span>
</a>

<a href="topup.html" class="nav-item active">
<i class="fas fa-gem"></i>
<span>Shop</span>
</a>

<a href="wallet-topup.html" class="nav-item">
<i class="fas fa-wallet"></i>
<span>Wallet</span>
</a>

<a href="history.html" class="nav-item">
<i class="fas fa-clock-rotate-left"></i>
<span>History</span>
</a>

<a href="profile.html" class="nav-item">
<i class="fas fa-user"></i>
<span>Profile</span>
</a>

</div>

<script src="theme.js"></script>
<script type="module" src="OrderDetails.js"></script>
</body>
</html>
