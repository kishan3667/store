<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="media.css">
<link rel="stylesheet" href="admin.css">

</head>

<body>
<div id="loadingIcon">
  <div class="dot-spinner">
    <div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div>
  </div>

  <p class="loading-text">Loading...</p>
</div>

<div class="neon-bg"></div>

<style>
.neon-bg{
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 20% 20%, rgba(0,255,255,.12), transparent 20%),
radial-gradient(circle at 80% 30%, rgba(140,0,255,.15), transparent 20%),
radial-gradient(circle at 50% 80%, rgba(255,0,200,.10), transparent 20%);
animation: pulseBg 6s infinite alternate;
z-index:-1;
}
@keyframes pulseBg{
from{transform:scale(1);}
to{transform:scale(1.08);}
}
</style>


<!-- Sidebar -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">
        <h2>ADMIN</h2>
    </div>

    <button onclick="showDashboard()">🏠 Home</button>
    <button onclick="viewUsers()">👤 Users</button>
    <button onclick="viewWalletTopups()">💰 Wallet Topups</button>
    <button onclick="viewOrders()">📦 Orders</button>
    <button onclick="viewTopups()">✅ Success</button>
    <button onclick="viewRejected()">❌ Rejected</button>
    <button onclick="viewPending()">⏳ Pending</button>
    <button onclick="maintenancePage()">🛠 Maintenance</button>

</div>
<!-- Main -->
<div class="main">

<div class="topbar">

<button class="menu-btn" onclick="openSidebar()">
☰
</button>

<h1>Admin Panel</h1>

</div>

  <!-- Cards -->
  <div class="cards">
    <div class="card">
      <h3>Total Users</h3>
      <p id="usersCount">0</p>
    </div>

    <div class="card">
      <h3>Total Orders</h3>
      <p id="ordersCount">0</p>
    </div>

    <div class="card">
      <h3>Success Topups</h3>
      <p id="topupCount">0</p>
    </div>
  </div>

    <div class="card wallet-card">
  <h3>Wallet Topups [ Pending ]</h3>
  <p id="walletPendingCount">0</p>
</div>

  <!-- Content -->
  <div class="content" id="contentBox">
  Dashboard Overview 📊
  </div>
  
</div>

<!-- Success Toast -->
<div id="toast" class="toast">
  <span id="toastMessage">Success</span>
</div>

<script type="module" src="admin.js"></script>

<!-- Wallet Popup -->
<div id="walletPopup" class="wallet-popup">
  <div class="wallet-box">
    <h3>💰 Wallet Topup</h3>

    <input
      type="number"
      id="walletAmount"
      placeholder="Enter Wallet Amount">

    <div class="wallet-buttons">
      <button id="walletCancel">Cancel</button>
      <button id="walletOk">Success</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

</body>
</html>
