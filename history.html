<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="theme.css">


<title>History</title>

<style>
html, body, *{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:var(--header);
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:var(--text);
  border-bottom:1px solid var(--border);
}

.container{
  width:95%;
  max-width:420px;
  margin:15px auto;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  border:1px solid var(--primary);
  box-shadow:var(--shadow);
  word-wrap:break-word;
}

.card p{
  margin:8px 0;
  font-size:14px;
  line-height:1.5;
  color:var(--text);
}

.success{
  color:#22c55e;
  font-weight:bold;
}

.reject{
  color:#ef4444;
  font-weight:bold;
}

.pending{
  color:#f59e0b;
  font-weight:bold;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:var(--card);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--border);
  box-shadow:0 -5px 20px rgba(0,0,0,.2);
  z-index:1000;
}

.nav-item{
  text-align:center;
  text-decoration:none;
  color:var(--text2);
  font-size:12px;
  transition:.3s;
}

.nav-item i{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.nav-item:hover,
.nav-item.active{
  color:var(--primary);
}

/* Mobile */
@media (max-width:600px){

  .header{
    font-size:18px;
    padding:15px;
  }

  .container{
    width:94%;
    margin:10px auto;
  }

  .card{
    padding:10px;
    border-radius:10px;
  }

  .card p{
    font-size:13px;
  }

}

</style>
</head>

<body>

<div class="header">
🕒 Topup History
</div>

<div class="container" id="historyBox">
Loading...
</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://tvhgxlqqeklrdlgbkosa.supabase.co";

const supabaseKey =
"sb_publishable_Ep28HPF1SXIXQXBF2i__eg_h_jmjw4I";

const supabase =
createClient(supabaseUrl, supabaseKey);

const { data } = await supabase
  .from("settings")
  .select("maintenance")
  .eq("id", 1)
  .single();

if (
  data?.maintenance === true &&
  !window.location.pathname.endsWith("maintenance.html")
) {
  window.location.href = "maintenance.html";
}

const box =
document.getElementById("historyBox");

const {
  data: { session }
} = await supabase.auth.getSession();

if (!session) {
  window.location.href = "index.html";
}

const { data: orders, error } =
await supabase
.from("orders")
.select("*")
.eq("user_id", session.user.id)
.order("created_at", { ascending: false });

let html = "";

if (!error) {

  orders.forEach((data) => {

    let colorClass = "pending";

    if (data.status === "success") {
      colorClass = "success";
    } else if (data.status === "reject") {
      colorClass = "reject";
    }

    html += `
<div class="card">

<p>🆔 Order ID : ${data.id}</p>

<p>🎮 UID : ${data.uid}</p>

<p>💎 Topup : ${data.topup}</p>

<p>
📌 Status :
<span class="${colorClass}">
${data.status}
</span>
</p>

</div>
`;

  });

}

if (html === "") {

  html = `
<div class="card" style="text-align:center;">

<i class="fas fa-clock-rotate-left"
style="font-size:40px;color:#38bdf8;"></i>

<h3>No Top-Up History Found</h3>

<p>Your top-up history will appear here</p>

</div>
`;

}

box.innerHTML = html;

</script>

<div class="bottom-nav">

<a href="home.html" class="nav-item">
    <i class="fas fa-home"></i>
    <span>Home</span>
  </a>

  <a href="topup.html" class="nav-item">
    <i class="fas fa-gem"></i>
    <span>Shop</span>
  </a>

  <a href="payment.html" class="nav-item active">
    <i class="fas fa-bolt"></i>
    <span>Payment</span>
  </a>

  <a href="history.html" class="nav-item">
  <i class="fas fa-clock-rotate-left"></i>
  <span>History</span>
</a>

  <a href="profile.html" class="nav-item">
    <i class="fas fa-user"></i>
    <span>Profile</span>
  </a>

</div>
<script src="theme.js"></script>
</body>
</html>
