<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="theme.css">


<title>History</title>

<style>
html, body, *{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:var(--header);
  padding:15px 18px;
  border-bottom:1px solid var(--border);

  display:flex;
  justify-content:space-between;
  align-items:center;

  color:var(--text);
  font-size:20px;
  font-weight:bold;
}

.wallet-pill{
  display:flex;
  align-items:center;
  gap:5px;

  padding:8px 16px;

  background:var(--card);
  border:1px solid var(--primary);
  border-radius:999px;

  color:var(--primary);
  font-size:14px;
  font-weight:bold;

  box-shadow:var(--shadow);

  cursor:pointer;
  transition:.2s;
}

.wallet-pill:hover{
  transform:scale(1.03);
}

.wallet-pill:active{
  transform:scale(.97);
}

.container{
  width:95%;
  max-width:420px;
  margin:15px auto;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  border:1px solid var(--primary);
  box-shadow:var(--shadow);
  word-wrap:break-word;
}

.card p{
  margin:8px 0;
  font-size:14px;
  line-height:1.5;
  color:var(--text);
}

.success{
  color:#22c55e;
  font-weight:bold;
}

.reject{
  color:#ef4444;
  font-weight:bold;
}

.pending{
  color:#f59e0b;
  font-weight:bold;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:var(--card);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--border);
  box-shadow:0 -5px 20px rgba(0,0,0,.2);
  z-index:1000;
}

.nav-item{
  text-align:center;
  text-decoration:none;
  color:var(--text2);
  font-size:12px;
  transition:.3s;
}

.nav-item i{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.nav-item:hover,
.nav-item.active{
  color:var(--primary);
}

.tabs{
display:flex;
justify-content:space-evenly;
align-items:center;
margin:18px 0;
}

.tab-btn{
background:none;
border:none;
color:var(--text);
font-size:18px;
font-weight:bold;
padding:10px 5px;
cursor:pointer;
}

.tab-btn.active{
color:var(--primary);
border-bottom:3px solid var(--primary);
}

/* Mobile */
@media (max-width:600px){

  .header{
    font-size:18px;
    padding:15px;
  }

  .container{
    width:94%;
    margin:10px auto;
  }

  .card{
    padding:10px;
    border-radius:10px;
  }

  .card p{
    font-size:13px;
  }

}

.history-wrapper{
width:95%;
max-width:420px;
margin:0 auto;
display:flex;
flex-direction:column;
height:calc(100vh - 170px);
}

.tabs{
display:flex;
background:var(--card);
border-radius:12px;
overflow:hidden;
border:1px solid var(--border);
margin-bottom:12px;
flex-shrink:0;
margin:8px 0 12px 0;
}

.tab-btn{
flex:1;
padding:14px;
border:none;
background:none;
color:var(--text);
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.tab-btn.active{
background:var(--primary);
color:#fff;
}

.history-content{
flex:1;
overflow-y:auto;
padding-bottom:80px;
}

.history-page{
display:none;
}

.history-page.active{
display:block;
}

.card{
background:var(--card);
border-radius:12px;
padding:14px;
margin-bottom:12px;
border:1px solid var(--primary);
box-shadow:var(--shadow);
}

.card p{
margin:8px 0;
font-size:14px;
word-break:break-word;
}

@media(max-width:600px){

.history-wrapper{
width:94%;
height:calc(100vh - 160px);
}

.tab-btn{
font-size:13px;
padding:12px;
}

.card p{
font-size:13px;
}

}

</style>
</head>

<body>

<div class="header">

  <span>🕒 History</span>

  <div class="wallet-pill" onclick="location.href='wallet-topup.html'">

    💰 Rs.
    <span id="liveBalance">0.00</span>

  </div>

</div>


<div class="history-wrapper">

  <div class="tabs">
    <button class="tab-btn active" id="topupTab">
      TOP UP HISTORY
    </button>

    <button class="tab-btn" id="walletTab">
      WALLET HISTORY
    </button>
  </div>

  <div class="history-content">

    <div class="history-page active" id="topupHistory">
      Loading...
    </div>

    <div class="history-page" id="walletHistory">
      Loading...
    </div>

  </div>

</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://tvhgxlqqeklrdlgbkosa.supabase.co";

const supabaseKey =
"sb_publishable_Ep28HPF1SXIXQXBF2i__eg_h_jmjw4I";

const supabase =
createClient(supabaseUrl, supabaseKey);

const { data } = await supabase
  .from("settings")
  .select("maintenance")
  .eq("id", 1)
  .single();

if (
  data?.maintenance === true &&
  !window.location.pathname.endsWith("maintenance.html")
) {
  window.location.href = "maintenance.html";
}

const topupBox =
document.getElementById("topupHistory");

const walletBox =
document.getElementById("walletHistory");

const {
  data: { session }
} = await supabase.auth.getSession();

if (!session) {
  window.location.href = "index.html";
}

// Live Wallet Balance
const { data: profile, error: profileError } = await supabase
  .from("profiles")
  .select("wallet_balance")
  .eq("id", session.user.id)
  .single();

if (!profileError) {
  document.getElementById("liveBalance").textContent =
    Number(profile.wallet_balance || 0).toFixed(2);
}

const { data: orders, error } =
await supabase
.from("orders")
.select("*")
.eq("user_id", session.user.id)
.order("created_at", { ascending: false });

let html = "";

if (!error) {

  orders.forEach((data) => {

    let colorClass = "pending";

    if (data.status === "success") {
      colorClass = "success";
    } else if (data.status === "reject") {
      colorClass = "reject";
    }

    html += `
<div class="card">

<p>🆔 Order ID : ${data.id}</p>

<p>🎮 UID : ${data.uid}</p>

<p>💎 Product : ${data.product_name}</p>

<p>📂 Category : ${data.category}</p>

<p>💵 Price : Rs. ${Number(data.price).toFixed(2)}</p>

<p>
📌 Status :
<span class="${colorClass}">
${data.status}
</span>
</p>

</div>
`;

  });

}

if (html === "") {

  html = `
<div class="card" style="text-align:center;">

<i class="fas fa-clock-rotate-left"
style="font-size:40px;color:#38bdf8;"></i>

<h3>No Top-Up History Found</h3>

<p>Your top-up history will appear here</p>

</div>
`;

}

topupBox.innerHTML = html;

// Wallet History

const { data: wallets, error: walletError } =
await supabase
.from("wallet_topups")
.select("*")
.eq("user_id", session.user.id)
.order("created_at", { ascending: false });

let walletHtml = "";

if (!walletError) {

  wallets.forEach((data) => {

    let colorClass = "pending";

    if (data.status === "success") {
      colorClass = "success";
    } else if (data.status === "reject") {
      colorClass = "reject";
    }

    walletHtml += `
<div class="card">

<p>💰 Amount : Rs. ${data.amount}</p>

<p>📱 WhatsApp : ${data.whatsapp}</p>

<p>📧 Email : ${data.email}</p>

<p>
📌 Status :
<span class="${colorClass}">
${data.status}
</span>
</p>

${
data.receipt_url
? `<p>
🧾 <a href="${data.receipt_url}" target="_blank"
style="color:#38bdf8;text-decoration:none;">
View Receipt
</a>
</p>`
: ""
}

</div>
`;

  });

}

if (walletHtml === "") {

  walletHtml = `
<div class="card" style="text-align:center;">

<i class="fas fa-wallet"
style="font-size:40px;color:#38bdf8;"></i>

<h3>No Wallet History Found</h3>

<p>Your wallet history will appear here</p>

</div>
`;

}

walletBox.innerHTML = walletHtml;


// Tab Switch

const topupTab =
document.getElementById("topupTab");

const walletTab =
document.getElementById("walletTab");

topupTab.onclick = () => {

topupHistory.style.display = "block";

walletHistory.style.display = "none";

topupTab.classList.add("active");

walletTab.classList.remove("active");

};

walletTab.onclick = () => {

topupHistory.style.display = "none";

walletHistory.style.display = "block";

walletTab.classList.add("active");

topupTab.classList.remove("active");

};

</script>

<div class="bottom-nav">

<a href="home.html" class="nav-item">
<i class="fas fa-home"></i>
<span>Home</span>
</a>

<a href="topup.html" class="nav-item">
<i class="fas fa-gem"></i>
<span>Shop</span>
</a>

<a href="wallet-topup.html" class="nav-item active">
<i class="fas fa-wallet"></i>
<span>Wallet</span>
</a>

<a href="history.html" class="nav-item">
<i class="fas fa-clock-rotate-left"></i>
<span>History</span>
</a>

<a href="profile.html" class="nav-item">
<i class="fas fa-user"></i>
<span>Profile</span>
</a>

</div>
<script src="theme.js"></script>
</body>
</html>
