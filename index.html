<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOENIX TK</title>
    <meta name="description" content="Soft-UI login form with realistic dual shadows and ambient mouse-tracked lighting.">
    <meta name="author" content="Aigars Silkalns / Colorlib">
    <link rel="canonical" href="https://puikinsh.github.io/login-forms/forms/neumorphism/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Neumorphism Login Form">
    <meta property="og:description" content="Soft-UI login form with realistic dual shadows and ambient mouse-tracked lighting.">
    <meta property="og:url" content="https://puikinsh.github.io/login-forms/forms/neumorphism/">
    <meta property="og:image" content="https://puikinsh.github.io/login-forms/assets/screenshots/neumorphism.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Neumorphism Login Form">
    <meta name="twitter:description" content="Soft-UI login form with realistic dual shadows and ambient mouse-tracked lighting.">
    <meta name="twitter:image" content="https://puikinsh.github.io/login-forms/assets/screenshots/neumorphism.png">
    <link rel="stylesheet" href="index.css">
   
    <link rel="icon" href="1.jpg">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="neu-icon">
                    <div class="icon-inner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </div>
                <h2>Welcome back</h2>
                <p>Please sign in to continue</p>
            </div>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <div class="input-group neu-input">
                        <input type="email" id="email" name="email" required autocomplete="email" placeholder=" ">
                        <label for="email">Email address</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </div>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <div class="input-group neu-input password-group">
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder=" ">
                        <label for="password">Password</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </div>
                    </div>
                    <span id="passwordError" style="color:red;display:none;">
Invalid email or password
</span>
                </div>

                <div class="form-options">
                    <div class="remember-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" class="checkbox-label">
                            <div class="neu-checkbox">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12"/>
                                </svg>
                            </div>
                            Remember me
                        </label>
                    </div>
                <a href="forgot-password.html" class="forgot-link">
                               Forgot password?
                            </a>
                </div>

                <button type="submit" class="neu-button login-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-loader">
                        <div class="neu-spinner"></div>
                    </div>
                </button>
            </form>

           

            <div class="signup-link">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
            </div>

            <div class="success-message" id="successMessage">
                <div class="success-icon neu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <h3>Success!</h3>
                <p>Redirecting to your dashboard...</p>
            </div>
        </div>
    </div>
<script type="module">

import { createClient } from 
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const supabaseUrl =
"https://tvhgxlqqeklrdlgbkosa.supabase.co";


const supabaseKey =
"sb_publishable_Ep28HPF1SXIXQXBF2i__eg_h_jmjw4I";


const supabase =
createClient(supabaseUrl, supabaseKey);

const { data } = await supabase
  .from("settings")
  .select("maintenance")
  .eq("id", 1)
  .single();

if (
  data?.maintenance === true &&
  !window.location.pathname.endsWith("maintenance.html")
) {
  window.location.href = "maintenance.html";
}

/* Already logged in check */

const { data: { session } } =
await supabase.auth.getSession();


if(session){

localStorage.setItem(
"userId",
session.user.id
);

window.location.replace("home.html");

}



/* LOGIN */

const loginBtn =
document.querySelector(".login-btn");

document
.getElementById("loginForm")
.addEventListener("submit", async(e)=>{

e.preventDefault();

loginBtn.disabled = true;
loginBtn.querySelector(".btn-text").innerText = "Wait...";

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value.trim();

const passwordError =
document.getElementById("passwordError");

passwordError.style.display = "none";



const {data,error} =
await supabase.auth.signInWithPassword({

email: email,

password: password

});



if(error){

loginBtn.disabled = false;
loginBtn.querySelector(".btn-text").innerText = "Sign In";

passwordError.style.display = "block";

return;

}



localStorage.setItem(
"userId",
data.user.id
);

passwordError.style.display = "none";

window.location.replace("home.html");

});


</script>
<style>
/* TABLET */
@media (max-width: 1024px) {
  .card {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* MOBILE */
@media (max-width: 768px) {
  .card {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 24px;
  }
}

/* SMALL MOBILE */
@media (max-width: 480px) {
  h1 {
    font-size: 20px;
  }

  p {
    font-size: 14px;
  }
}

/* Desktop */
.container{
  width: 80%;
  margin: auto;
}
</style>

</body>
</html>
